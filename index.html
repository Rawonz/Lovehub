<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e2486d" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="author" content="RawonzEXE" />

    <!-- Primary SEO -->
    <title>LoveHub — Your love, beautifully organized.</title>
    <meta
      name="description"
      content="LoveHub — the all-in-one couples platform. Capture memories, plan dates, count down to anniversaries, and grow closer together."
    />
    <meta name="keywords" content="couples app, relationship tracker, date planner, anniversary countdown, shared memories, LoveHub" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LoveHub" />
    <meta property="og:title" content="LoveHub — Your love, beautifully organized." />
    <meta property="og:description" content="The all-in-one couples platform. Memories, dates, anniversaries, and more." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LoveHub — Your love, beautifully organized." />
    <meta name="twitter:description" content="The all-in-one couples platform. Memories, dates, anniversaries, and more." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Inline critical CSS: branded loader + FOUC prevention -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #fff5f7;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0f0f1a; }
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: inherit;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      #initial-loader .lh-logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: linear-gradient(135deg, #e2486d, #f07a45);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(226,72,109,0.35);
      }
      #initial-loader .lh-logo svg {
        width: 24px;
        height: 24px;
        fill: white;
      }
      #initial-loader .spinner {
        width: 36px;
        height: 36px;
        border: 2.5px solid rgba(226, 72, 109, 0.15);
        border-top-color: #e2486d;
        border-radius: 50%;
        animation: lh-spin 0.75s linear infinite;
      }
      @keyframes lh-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader .spinner { animation: none; border-color: #e2486d; }
      }
      #root:not(:empty) ~ #initial-loader { display: none; }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto;">
        <h1 style="font-size: 1.5rem; margin-bottom: 1rem;">JavaScript Required</h1>
        <p>LoveHub requires JavaScript to run. Please enable it in your browser settings to continue.</p>
      </div>
    </noscript>

    <div id="root"></div>

    <!-- Branded splash loader shown while React bundle boots -->
    <div id="initial-loader" role="status" aria-label="Loading LoveHub…">
      <div class="lh-logo" aria-hidden="true">
        <!-- Heart SVG icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </div>
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
